   お絵描き
   ========================================================= */
const DR = {strokes:[], redo:[], color:'#1b1d22', size:6, erase:false, cur:null, pen:false, dpr:1};
const DR_COLORS = ['#1b1d22','#e5342a','#ff9500','#ffcc00','#34c759','#2f6fed','#32ade6','#af52de','#ff2d55','#8e5a2b'];
const DR_SIZES = [[3,'細'],[6,'中'],[12,'太'],[24,'極太']];
const mid = (a, b) => ({x:(a.x+b.x)/2, y:(a.y+b.y)/2});
function drSeg(g, s, i){
  const p = s.pts, a = p[i-1], b = p[i];
  g.strokeStyle = s.erase ? '#ffffff' : s.color; g.lineWidth = (a.w + b.w) / 2;
  g.lineCap = 'round'; g.lineJoin = 'round';
  const st = i > 1 ? mid(p[i-2], a) : a, en = mid(a, b);
  g.beginPath(); g.moveTo(st.x, st.y); g.quadraticCurveTo(a.x, a.y, en.x, en.y); g.stroke();
}
function drEnd(g, s){
  const p = s.pts, n = p.length;
  if (n === 1){ g.fillStyle = s.erase ? '#ffffff' : s.color; g.beginPath(); g.arc(p[0].x, p[0].y, p[0].w/2, 0, Math.PI*2); g.fill(); return; }
  const a = p[n-2], b = p[n-1], st = mid(a, b);
  g.strokeStyle = s.erase ? '#ffffff' : s.color; g.lineWidth = b.w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(st.x, st.y); g.lineTo(b.x, b.y); g.stroke();
}
function drCtx(){ const c = $('#drCanvas'), g = c.getContext('2d'); g.setTransform(DR.dpr, 0, 0, DR.dpr, 0, 0); return g; }
function drRedraw(){
  const c = $('#drCanvas'), g = c.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
  g.setTransform(DR.dpr, 0, 0, DR.dpr, 0, 0);
  DR.strokes.forEach(s => { for (let i = 1; i < s.pts.length; i++) drSeg(g, s, i); drEnd(g, s); });
}
function drResize(){
  const w = $('#drWrap'), c = $('#drCanvas'); if (!w.clientWidth) return;
  DR.dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = Math.round(w.clientWidth * DR.dpr); c.height = Math.round(w.clientHeight * DR.dpr);
  drRedraw();
}
function renderDrawBar(){
  $('#drBar').innerHTML =
    DR_COLORS.map(c => `<button class="sw ${!DR.erase && DR.color === c ? 'on' : ''}" style="background:${c}" data-c="${c}" aria-label="色"></button>`).join('') +
    `<input type="color" class="colorpick" id="drPick" value="${DR.color}" aria-label="色を選ぶ"><span class="sep"></span>` +
    DR_SIZES.map(([v, l]) => `<button class="btn ${DR.size === v ? 'on' : ''}" data-sz="${v}">${l}</button>`).join('') +
    `<span class="sep"></span><button class="btn ${DR.erase ? 'on' : ''}" id="drErase">🧽 消しゴム</button>` +
    `<button class="btn sq" id="drUndo" aria-label="元に戻す" ${DR.strokes.length ? '' : 'disabled'}>↶</button>` +
    `<button class="btn sq" id="drRedo" aria-label="やり直す" ${DR.redo.length ? '' : 'disabled'}>↷</button>` +
    `<button class="btn sq" id="drClear" aria-label="全消去">🗑️</button>` +
    `<button class="btn primary" id="drSave" style="margin-left:auto">保存・共有</button>`;
}
PAGES.draw = {
  title:'お絵描き',
  init(){
    const c = $('#drCanvas');
    $('#drBar').addEventListener('click', async e => {
      const t = e.target;
      if (t.dataset.c){ DR.color = t.dataset.c; DR.erase = false; }
      else if (t.dataset.sz){ DR.size = +t.dataset.sz; }
      else if (t.id === 'drErase'){ DR.erase = !DR.erase; }
      else if (t.id === 'drUndo'){ if (DR.strokes.length){ DR.redo.push(DR.strokes.pop()); drRedraw(); } }
      else if (t.id === 'drRedo'){ if (DR.redo.length){ DR.strokes.push(DR.redo.pop()); drRedraw(); } }
      else if (t.id === 'drClear'){ if (!DR.strokes.length || !(await confirmDialog('描いた内容をすべて消去してもよろしいですか？', '消去', true))) return; DR.strokes = []; DR.redo = []; drRedraw(); }
      else if (t.id === 'drSave'){ c.toBlob(b => saveImage(b, stampName('drawing', 'png')), 'image/png'); return; }
      else return;
      renderDrawBar();
    });
    $('#drBar').addEventListener('input', e => { if (e.target.id === 'drPick'){ DR.color = e.target.value; DR.erase = false; $$('.sw', $('#drBar')).forEach(s => s.classList.remove('on')); } });
    const pt = e => { const r = c.getBoundingClientRect(); const w = e.pointerType === 'pen' ? DR.size * (0.35 + (e.pressure || .5) * 1.3) : DR.size; return {x:e.clientX - r.left, y:e.clientY - r.top, w: DR.erase ? DR.size * 2.5 : w}; };
    c.addEventListener('pointerdown', e => {
      if (e.pointerType === 'pen') DR.pen = true;
      if (DR.pen && e.pointerType === 'touch') return; // Apple Pencil 使用中は手のひらの誤タッチを無視します
      if (DR.cur) return;
      c.setPointerCapture(e.pointerId);
      DR.cur = {id:e.pointerId, s:{color:DR.color, erase:DR.erase, pts:[pt(e)]}};
      DR.strokes.push(DR.cur.s); DR.redo = [];
    });
    c.addEventListener('pointermove', e => {
      if (!DR.cur || DR.cur.id !== e.pointerId) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e], g = drCtx();
      (evs.length ? evs : [e]).forEach(ev => { DR.cur.s.pts.push(pt(ev)); drSeg(g, DR.cur.s, DR.cur.s.pts.length - 1); });
    });
    const up = e => { if (!DR.cur || DR.cur.id !== e.pointerId) return; drEnd(drCtx(), DR.cur.s); DR.cur = null; renderDrawBar(); };
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
    new ResizeObserver(() => { if (current === 'draw') drResize(); }).observe($('#drWrap'));
  },
  enter(){ renderDrawBar(); requestAnimationFrame(drResize); }
};

/* =========================================================
   ピアノ
   ========================================================= */
const PN = {oct:4, tone:'piano', vol:.6, names:true, voices:new Map()};
const PN_TONES = {piano:'ピアノ', organ:'オルガン', synth:'シンセ'};
const NOTE_JA = ['ド','','レ','','ミ','ファ','','ソ','','ラ','','シ'];
function pnStart(midi){
  const c = ac(), t = c.currentTime, f = 440 * Math.pow(2, (midi - 69) / 12);
  const env = c.createGain(), rel = c.createGain();
  env.connect(rel).connect(c.destination);
  const v = PN.vol * .5;
  const parts = PN.tone === 'organ' ? [[1,'sine',1],[2,'sine',.5],[4,'sine',.22]]
              : PN.tone === 'synth' ? [[1,'sawtooth',.45],[1.005,'square',.2]]
              : [[1,'triangle',1],[2,'sine',.35],[3,'sine',.12]];
  const oscs = parts.map(([m, type, g]) => { const o = c.createOscillator(), gg = c.createGain(); o.type = type; o.frequency.value = f * m; gg.gain.value = g; o.connect(gg).connect(env); o.start(t); return o; });
  env.gain.setValueAtTime(.0001, t);
  env.gain.exponentialRampToValueAtTime(v, t + (PN.tone === 'organ' ? .03 : .006));
  if (PN.tone === 'piano'){ env.gain.exponentialRampToValueAtTime(v * .3, t + .8); env.gain.exponentialRampToValueAtTime(.0001, t + 4); }
  return () => { const n = c.currentTime; rel.gain.setTargetAtTime(0, n, PN.tone === 'piano' ? .12 : .06); oscs.forEach(o => o.stop(n + .8)); };
}
function renderPiano(){
  $('#pnBar').innerHTML =
    `<span class="lbl">音色</span><div class="chips">${Object.entries(PN_TONES).map(([k, n]) => `<button class="chip ${PN.tone === k ? 'on' : ''}" data-tone="${k}">${n}</button>`).join('')}</div>` +
    `<span class="sep"></span><span class="lbl">オクターブ</span><button class="btn sq" data-oct="-1">－</button><span class="oct">${PN.oct}</span><button class="btn sq" data-oct="1">＋</button>` +
    `<span class="sep"></span><span class="lbl">音量</span><input type="range" min="0" max="1" step="0.05" value="${PN.vol}" id="pnVol">` +
    `<span class="sep"></span><span class="lbl">音名</span><label class="switch"><input type="checkbox" id="pnNames" ${PN.names ? 'checked' : ''}><span></span></label>`;
  const start = 12 * (PN.oct + 1), whites = [], blacks = [];
  for (let m = start; m <= start + 24; m++){ (NOTE_JA[m % 12] ? whites : blacks).push(m); }
  const ww = 100 / whites.length, bw = ww * .62;
  let html = whites.map((m, i) => `<div class="wk" data-n="${m}" style="left:${i*ww}%;width:${ww}%">${PN.names ? NOTE_JA[m % 12] + (m % 12 === 0 ? `<sub style="font-size:.7em">${Math.floor(m/12) - 1}</sub>` : '') : ''}</div>`).join('');
  html += blacks.map(m => { const i = whites.indexOf(m - 1) + 1; return `<div class="bk" data-n="${m}" style="left:${i*ww - bw/2}%;width:${bw}%"></div>`; }).join('');
  $('#pnKeys').innerHTML = html;
}
function pnKeyAt(x, y){ const k = document.elementFromPoint(x, y); return k && k.closest('#pnKeys [data-n]'); }
function pnOn(id, key){
  const old = PN.voices.get(id);
  if (old){ if (old.key === key) return; old.stop(); old.key.classList.remove('on'); PN.voices.delete(id); }
  if (!key) return;
  key.classList.add('on');
  PN.voices.set(id, {key, stop:pnStart(+key.dataset.n)});
}
function pnOff(id){ const v = PN.voices.get(id); if (v){ v.stop(); v.key.classList.remove('on'); PN.voices.delete(id); } }
PAGES.piano = {
  title:'ピアノ',
  init(){
    $('#pnBar').addEventListener('click', e => {
      const t = e.target.closest('[data-tone],[data-oct]'); if (!t) return;
      if (t.dataset.tone) PN.tone = t.dataset.tone;
      if (t.dataset.oct) PN.oct = Math.min(6, Math.max(1, PN.oct + Number(t.dataset.oct)));
      renderPiano();
    });
    $('#pnBar').addEventListener('input', e => { if (e.target.id === 'pnVol') PN.vol = +e.target.value; });
    $('#pnBar').addEventListener('change', e => { if (e.target.id === 'pnNames'){ PN.names = e.target.checked; renderPiano(); } });
    const kb = $('#pnKeys');
    kb.addEventListener('pointerdown', e => { e.preventDefault(); kb.setPointerCapture(e.pointerId); pnOn(e.pointerId, pnKeyAt(e.clientX, e.clientY)); });
    kb.addEventListener('pointermove', e => { if (PN.voices.has(e.pointerId)) pnOn(e.pointerId, pnKeyAt(e.clientX, e.clientY)); });
    ['pointerup','pointercancel'].forEach(t => kb.addEventListener(t, e => pnOff(e.pointerId)));
  },
  enter: renderPiano,
  leave(){ [...PN.voices.keys()].forEach(pnOff); }
};

/* =========================================================
   電卓・単位換算
   ========================================================= */
const CK = {toks:[], cur:'0', done:false, expr:''};
const CALC_OPS = ['+', '−', '×', '÷'];
const isOp = x => CALC_OPS.includes(x);
function fmtNumStr(s){
  if (s === '' || s == null) return '0';
  if (s === '-') return '−';
  if (/e/i.test(s) || /[^\d.\-]/.test(s)) return s.replace('-', '−');
  const neg = s.startsWith('-'), [i, f] = s.replace('-', '').split('.');
  return (neg ? '−' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f !== undefined ? '.' + f : '');
}
function numToStr(n){
  if (!isFinite(n)) return 'エラー';
  if (n === 0) return '0';
  const a = Math.abs(n);
  if (a >= 1e15 || a < 1e-9) return n.toExponential(8).replace(/\.?0+e/, 'e');
  const s = String(parseFloat(n.toPrecision(12)));
  return /e/.test(s) ? n.toFixed(12).replace(/\.?0+$/, '') : s;
}
function calcEval(t){
  const nums = [parseFloat(t[0])], ops = [];
  for (let i = 1; i < t.length; i += 2){
    const op = t[i], n = parseFloat(t[i + 1]);
    if (op === '×') nums[nums.length - 1] *= n;
    else if (op === '÷'){ if (n === 0) return NaN; nums[nums.length - 1] /= n; }
    else { ops.push(op); nums.push(n); }
  }
  let r = nums[0];
  ops.forEach((op, i) => { r = op === '+' ? r + nums[i + 1] : r - nums[i + 1]; });
  return r;
}
function calcKey(k){
  const C = CK;
  if (C.cur === 'エラー'){ C.toks = []; C.cur = '0'; C.done = false; C.expr = ''; if (k === 'C') return renderCalcDisp(); }
  const fresh = () => { if (C.done){ C.toks = []; C.cur = ''; C.done = false; C.expr = ''; } };
  if (/^\d$/.test(k)){
    fresh();
    if (C.cur.replace(/[-.]/g, '').length >= 15) return;
    C.cur = (C.cur === '0' ? '' : C.cur === '-0' ? '-' : C.cur) + k;
  } else if (k === '.'){
    fresh(); if (C.cur === '' || C.cur === '-') C.cur += '0';
    if (!C.cur.includes('.')) C.cur += '.';
  } else if (isOp(k)){
    if (C.done){ C.toks = []; C.done = false; C.expr = ''; }
    if (C.cur !== '' && C.cur !== '-'){ C.toks.push(C.cur.replace(/\.$/, '')); C.cur = ''; }
    if (!C.toks.length) C.toks.push('0');
    if (isOp(C.toks[C.toks.length - 1])) C.toks[C.toks.length - 1] = k; else C.toks.push(k);
  } else if (k === '±'){
    if (C.done){ C.toks = []; C.done = false; C.expr = ''; }
    C.cur = C.cur.startsWith('-') ? C.cur.slice(1) : '-' + C.cur;
  } else if (k === '%'){
    if (C.cur && C.cur !== '-'){ C.cur = numToStr(parseFloat(C.cur) / 100); C.done = false; C.expr = ''; }
  } else if (k === '⌫'){
    if (C.done){ C.done = false; C.expr = ''; }
    else if (C.cur !== ''){ C.cur = C.cur.slice(0, -1); if (C.cur === '' && !C.toks.length) C.cur = '0'; }
    else if (C.toks.length){ C.toks.pop(); C.cur = C.toks.pop() || '0'; }
  } else if (k === 'C'){
    C.toks = []; C.cur = '0'; C.done = false; C.expr = '';
  } else if (k === '='){
    const t = [...C.toks];
    if (C.cur !== '' && C.cur !== '-') t.push(C.cur.replace(/\.$/, ''));
    if (isOp(t[t.length - 1])) t.pop();
    if (!t.length) return renderCalcDisp();
    const r = calcEval(t);
    C.expr = t.map(x => isOp(x) ? ` ${x} ` : fmtNumStr(x)).join('') + ' =';
    C.cur = numToStr(r); C.toks = []; C.done = true;
  }
  renderCalcDisp();
}
function renderCalcDisp(){
  const C = CK, ex = $('#cExpr'), v = $('#cVal'); if (!v) return;
  ex.textContent = C.done ? C.expr : C.toks.map(x => isOp(x) ? ` ${x} ` : fmtNumStr(x)).join('');
  const lastNum = [...C.toks].reverse().find(x => !isOp(x));
  const s = C.cur !== '' ? fmtNumStr(C.cur) : fmtNumStr(lastNum || '0');
  v.textContent = s;
  v.style.fontSize = s.length > 18 ? '30px' : s.length > 13 ? '38px' : '';
}
function calcValue(){ const n = parseFloat(CK.cur); if (!isNaN(n)) return n; const l = [...CK.toks].reverse().find(x => !isOp(x)); return l ? parseFloat(l) : 0; }

}
function muNext(dir = 1, auto = false){

const TR_LANGS = [['ja','日本語','ja-JP'],['en','英語','en-US'],['zh-CN','中国語（簡体字）','zh-CN'],['zh-TW','中国語（繁体字）','zh-TW'],['ko','韓国語','ko-KR'],['fr','フランス語','fr-FR'],['de','ドイツ語','de-DE'],['es','スペイン語','es-ES'],['it','イタリア語','it-IT'],['pt','ポルトガル語','pt-BR'],['ru','ロシア語','ru-RU'],['th','タイ語','th-TH'],['vi','ベトナム語','vi-VN'],['id','インドネシア語','id-ID']];
let trCfg = Object.assign({from:'ja', to:'en'}, store.get('tr', {}));
const byteLen = s => new TextEncoder().encode(s).length;
const decodeHtml = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
function trChunks(text){
  const out = [], MAX = 450;
  const lines = text.split('\n');
  lines.forEach((line, li) => {
    const sep = li < lines.length - 1 ? '\n' : '';
    if (!line.trim()){ out.push({t:line, sep, skip:true}); return; }
    if (byteLen(line) <= MAX){ out.push({t:line, sep}); return; }
    const parts = line.match(/[^。．.!?！？]+[。．.!?！？]*\s*/g) || [line];
    let buf = '';
    const flush = () => { if (buf){ out.push({t:buf, sep:null}); buf = ''; } };
    parts.forEach(p => {
      if (byteLen(buf + p) > MAX){
        flush();
        while (byteLen(p) > MAX){ let n = p.length; while (byteLen(p.slice(0, n)) > MAX) n = Math.floor(n * .8); out.push({t:p.slice(0, n), sep:null}); p = p.slice(n); }
      }
      buf += p;
    });
    flush();
    out[out.length - 1].sep = sep;
  });
  return out;
}
async function trRun(){
  const src = $('#trSrc').value;
  if (!src.trim()){ toast('翻訳したい文章を入力してください'); return; }
  if (trCfg.from === trCfg.to){ toast('翻訳元と翻訳先には、別の言語を選択してください', 'err'); return; }
  const btn = $('#trGo'); btn.disabled = true; btn.textContent = '翻訳しています…';
  const joiner = ['ja','zh-CN','zh-TW','th'].includes(trCfg.to) ? '' : ' ';
  try{
    let out = '';
    for (const c of trChunks(src)){
      let r = c.t;
      if (!c.skip){
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(c.t.trim())}&langpair=${encodeURIComponent(trCfg.from)}%7C${encodeURIComponent(trCfg.to)}`);
        if (res.status === 429) throw {quota:true};
        if (!res.ok) throw {status:res.status};
        const j = await res.json(), txt = (j && j.responseData && j.responseData.translatedText) || '';
        if (String(j.responseStatus) === '429' || /MYMEMORY WARNING|QUOTA/i.test(txt)) throw {quota:true};
        if (String(j.responseStatus) !== '200') throw {status:j.responseStatus, msg:j.responseDetails};
        r = decodeHtml(txt);
      }
      out += r + (c.sep == null ? joiner : c.sep);
    }
    $('#trDst').value = out;
  }catch(e){
    if (e && e.quota) toast('本日の無料翻訳の上限に達しました。時間をおいてから再度お試しください', 'err');
    else if (e instanceof TypeError) toast('翻訳サービスに接続できませんでした。ネットワーク接続をご確認ください', 'err');
    else toast(`翻訳できませんでした（${(e && (e.msg || e.status)) || '不明なエラー'}）`, 'err');
  }finally{ btn.disabled = false; btn.textContent = '翻訳する'; }
}
function speak(text, lang){

  speechSynthesis.cancel();
  if (!text.trim()) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = lang; speechSynthesis.speak(u);

    $('#vTime').textContent = fmtElapsed(Date.now() - start);

    if (an){ an.getByteTimeDomainData(buf); let s = 0; for (const x of buf){ const v = (x - 128) / 128; s += v * v; } lv = Math.min(1, Math.sqrt(s / buf.length) * 5); }

function tzInfo(tz, now){
  try{
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', {timeZone:tz, year:'numeric', month:'numeric', day:'numeric', hour:'numeric', minute:'numeric', second:'numeric', hourCycle:'h23'}).formatToParts(now).map(x => [x.type, x.value]));

    return {d, diffH:Math.round((d - now) / 36e5 * 4) / 4};
  }catch(e){ return {d:now, diffH:0}; }
}
function wcSub(i, now){
  const dd = Math.round((new Date(i.d.getFullYear(), i.d.getMonth(), i.d.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);

/* =========================================================
   環境音（すべてブラウザ内で生成）
   ========================================================= */
const AMB = [['rain','雨','🌧️'],['wave','波','🌊'],['stream','小川','🏞️'],['wind','風','🍃'],['fire','焚き火','🔥'],['white','ホワイトノイズ','⚪'],['pink','ピンクノイズ','🌸'],['brown','ブラウンノイズ','🟤']];
const amb = {on:{}, master:null, bufs:{}, vol:store.get('ambVol', .6), sleepAt:0, sleepMin:0};
function noiseBuf(kind){
  if (amb.bufs[kind]) return amb.bufs[kind];
  const c = ac(), sr = c.sampleRate, len = sr * 5, f = Math.floor(sr * .2), b = c.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++){
    const d = b.getChannelData(ch);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0;
    for (let i = 0; i < len; i++){
      const w = Math.random() * 2 - 1;
      if (kind === 'white') d[i] = w * .4;
      else if (kind === 'pink'){ b0 = .99886*b0 + w*.0555179; b1 = .99332*b1 + w*.0750759; b2 = .969*b2 + w*.153852; b3 = .8665*b3 + w*.3104856; b4 = .55*b4 + w*.5329522; b5 = -.7616*b5 - w*.016898; d[i] = (b0+b1+b2+b3+b4+b5+b6 + w*.5362) * .11; b6 = w * .115926; }
      else { last = (last + .02 * w) / 1.02; d[i] = last * 3.5; }
    }
    // つなぎ目が目立たないように、終わりの部分を始まりへ自然につなげます（ループは0.2秒地点から）
    for (let i = 0; i < f; i++){ const t = i / f; d[len - f + i] = d[len - f + i] * (1 - t) + d[i] * t; }
  }
  return amb.bufs[kind] = b;
}
function ambMaster(){ if (!amb.master){ const c = ac(); amb.master = c.createGain(); amb.master.gain.value = amb.vol; amb.master.connect(c.destination); } return amb.master; }
function ambDrop(c, out, freq, vol, dur = .02){
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime;
  s.buffer = noiseBuf('white'); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 2;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(out); s.start(t, Math.random() * 4, dur + .03);
}
function ambStart(k){
  const c = ac(); if (c.state !== 'running') c.resume();
  const out = c.createGain(); out.gain.setValueAtTime(0, c.currentTime); out.gain.linearRampToValueAtTime(1, c.currentTime + 1.5); out.connect(ambMaster());
  const nodes = [out], timers = [];
  const src = kind => { const s = c.createBufferSource(); s.buffer = noiseBuf(kind); s.loop = true; s.loopStart = .2; s.loopEnd = s.buffer.duration; s.start(); nodes.push(s); return s; };
  const filt = (type, fr, q = .7) => { const x = c.createBiquadFilter(); x.type = type; x.frequency.value = fr; x.Q.value = q; nodes.push(x); return x; };
  const gain = v => { const g = c.createGain(); g.gain.value = v; nodes.push(g); return g; };
  const lfo = (fr, depth, param) => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = fr; g.gain.value = depth; o.connect(g).connect(param); o.start(); nodes.push(o, g); };
  if (k === 'white' || k === 'pink' || k === 'brown') src(k).connect(gain(k === 'white' ? .6 : 1)).connect(out);
  else if (k === 'rain'){
    src('pink').connect(filt('highpass', 400)).connect(filt('lowpass', 9000)).connect(gain(.9)).connect(out);
    timers.push(setInterval(() => { if (Math.random() < .6) ambDrop(c, out, 2500 + Math.random() * 3000, .05 + Math.random() * .1); }, 70));
  } else if (k === 'wave'){
    const l = filt('lowpass', 900), g = gain(.55); src('brown').connect(l).connect(g).connect(out);
    lfo(.09, .45, g.gain); lfo(.09, 500, l.frequency);
  } else if (k === 'wind'){
    const b = filt('bandpass', 600, 1.2), g = gain(.8); src('pink').connect(b).connect(g).connect(out);
    lfo(.06, 300, b.frequency); lfo(.11, .3, g.gain);
  } else if (k === 'stream'){
    const b = filt('bandpass', 2200, .6); src('white').connect(b).connect(gain(.6)).connect(out);
    lfo(.4, 700, b.frequency);
  } else if (k === 'fire'){
    src('brown').connect(filt('lowpass', 500)).connect(gain(.8)).connect(out);
    timers.push(setInterval(() => { if (Math.random() < .35) ambDrop(c, out, 1500 + Math.random() * 4000, .15 + Math.random() * .3, .012); }, 90));
  }
  amb.on[k] = {out, nodes, timers};
}
function ambStop(k){
  const a = amb.on[k]; if (!a) return; delete amb.on[k];
  a.timers.forEach(clearInterval);
  const c = ac(), t = c.currentTime;
  a.out.gain.cancelScheduledValues(t); a.out.gain.setValueAtTime(a.out.gain.value, t); a.out.gain.linearRampToValueAtTime(0, t + .8);
  setTimeout(() => a.nodes.forEach(n => { try{ n.stop && n.stop(); }catch(e){} try{ n.disconnect(); }catch(e){} }), 1000);
}
function ambStopAll(){ Object.keys(amb.on).forEach(ambStop); amb.sleepAt = 0; amb.sleepMin = 0; renderAmb(); }
function ambSleepFire(){ ambStopAll(); toast('おやすみタイマーにより、環境音を停止しました'); }
function renderAmb(){
  if (!$('#ambGrid')) return;
  $('#ambGrid').innerHTML = AMB.map(([k, n, e]) => `<button class="ambt ${amb.on[k] ? 'on' : ''}" data-amb="${k}" aria-pressed="${!!amb.on[k]}"><span class="e">${e}</span><span class="n">${n}</span></button>`).join('');
  $$('[data-sleep]').forEach(b => b.classList.toggle('on', +b.dataset.sleep === amb.sleepMin));
  const cnt = Object.keys(amb.on).length;
  $('#ambInfo').textContent = cnt ? `${cnt}種類の音を再生中です${amb.sleepAt ? `（${fmtHM(new Date(amb.sleepAt)).main} に停止します）` : ''}` : 'タップすると再生します。複数の音を組み合わせることもできます。';
}
PAGES.ambient = {

  init(){
    $('#ambBody').innerHTML = `
      <div class="ambgrid" id="ambGrid"></div>
      <div class="card">
        <div class="srow"><span>音量</span><input type="range" id="ambVol" min="0" max="1" step="0.02" style="width:320px" aria-label="環境音の音量"></div>
        <div class="srow"><span>おやすみタイマー</span><div class="chips">${[[0,'オフ'],[15,'15分'],[30,'30分'],[60,'60分'],[90,'90分']].map(([v, n]) => `<button class="chip" data-sleep="${v}">${n}</button>`).join('')}</div></div>
        <div class="srow"><span class="hint" id="ambInfo"></span><button class="btn" id="ambStopAll">すべて停止</button></div>
      </div>
      <p class="hint">環境音は、ほかの画面に移動しても再生が続きます。</p>`;
    $('#ambVol').value = amb.vol;
    $('#ambVol').addEventListener('input', e => { amb.vol = +e.target.value; store.set('ambVol', amb.vol); if (amb.master) amb.master.gain.value = amb.vol; });
    $('#ambBody').addEventListener('click', e => {
      const a = e.target.closest('[data-amb]');
      if (a){ const k = a.dataset.amb; amb.on[k] ? ambStop(k) : ambStart(k); renderAmb(); return; }
      const s = e.target.closest('[data-sleep]');
      if (s){ amb.sleepMin = +s.dataset.sleep; amb.sleepAt = amb.sleepMin ? Date.now() + amb.sleepMin * 60000 : 0; renderAmb(); if (amb.sleepMin) toast(`${amb.sleepMin}分後に環境音を停止します`); return; }
      if (e.target.closest('#ambStopAll')) ambStopAll();
    });
  },
  enter: renderAmb
};

/* ---------- 起動 ---------- */
applyTheme();
route();
loadWeather();
requestWake();
loadHolidays();
</script>
</body>
</html>
